        <title>VortexSpira - Lógica Universal: El Patrón Oculto</title>

        <script>
            window.VORTEX_CONFIG = {
                coursePath: "data/demo/course.vsj", 
                courseLang: "es",

        </script>

        <link rel="preload" href="/resources/fonts/AtkinsonHyperlegible-Bold.woff2" as="font" type="font/woff2" crossorigin="anonymous">

        <link rel="stylesheet" href="/styles/themes/style-theme.css">

        <link rel="stylesheet" href="/styles/base/style-brand.css">
        <link rel="stylesheet" href="/styles/base/style-header.css">

        <link rel="preload" href="/styles/base/style-fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">

    <body>
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js', { scope: '/' })
                        .then(registration => {
                            console.log('[PWA] SW registrado con éxito en scope:', registration.scope);
                        })
                        .catch(err => {
                            console.error('[PWA] Fallo en el registro del SW:', err);
                        });
                });
            }
        </script>
    </body>
